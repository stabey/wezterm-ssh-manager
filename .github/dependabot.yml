version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/tui-opentui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/tui-rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/tui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
