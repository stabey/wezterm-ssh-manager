name: OpenTUI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "tui-opentui/**"
      - "plugin/sshmgr/tui.lua"
      - "plugin/sshmgr/config.lua"
      - "plugin/sshmgr/import.lua"
      - "plugin/sshmgr/profiles.lua"
      - "plugin/sshmgr/serialize.lua"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "REBUILDING.md"
      - ".github/workflows/opentui.yml"
  pull_request:
    paths:
      - "tui-opentui/**"
      - "plugin/sshmgr/tui.lua"
      - "plugin/sshmgr/config.lua"
      - "plugin/sshmgr/import.lua"
      - "plugin/sshmgr/profiles.lua"
      - "plugin/sshmgr/serialize.lua"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "REBUILDING.md"
      - ".github/workflows/opentui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentui-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tui-opentui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Verify release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(bun -e 'process.stdout.write(require("./package.json").version)')"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            printf 'tag %s does not match package version %s\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Smoke test compiled helper (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable="$(find dist -maxdepth 1 -type f -name 'sshmgr-tui-macos-*' -print -quit)"
          test -n "$executable"
          runtime_json="$($executable --create-runtime)"
          runtime_dir="$(RUNTIME_JSON="$runtime_json" bun -e 'process.stdout.write(JSON.parse(process.env.RUNTIME_JSON).runtime_dir)')"
          printf old > "$runtime_dir/snapshot.json"
          printf new > "$runtime_dir/snapshot.json.tmp-smoke"
          "$executable" --replace-file "$runtime_dir/snapshot.json.tmp-smoke" "$runtime_dir/snapshot.json"
          test "$(cat "$runtime_dir/snapshot.json")" = new
          "$executable" --cleanup-runtime "$runtime_dir"
          test ! -e "$runtime_dir"
      - name: Smoke test compiled helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = ".\dist\sshmgr-tui-windows-x64.exe"
          $runtime = (& $executable --create-runtime | ConvertFrom-Json)
          Set-Content -NoNewline -Path (Join-Path $runtime.runtime_dir "snapshot.json") -Value "old"
          Set-Content -NoNewline -Path (Join-Path $runtime.runtime_dir "snapshot.json.tmp-smoke") -Value "new"
          & $executable --replace-file (Join-Path $runtime.runtime_dir "snapshot.json.tmp-smoke") (Join-Path $runtime.runtime_dir "snapshot.json")
          if ((Get-Content -Raw (Join-Path $runtime.runtime_dir "snapshot.json")) -ne "new") { throw "snapshot replace failed" }
          & $executable --cleanup-runtime $runtime.runtime_dir
          if (Test-Path $runtime.runtime_dir) { throw "runtime cleanup failed" }
      - name: Normalize artifact reference
        id: artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          safe_ref="$(printf '%s' "$REF_NAME" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-')"
          test -n "$safe_ref"
          printf 'ref=%s\n' "$safe_ref" >> "$GITHUB_OUTPUT"
      - name: Package executable with license notices
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        run: bun run package --target ${{ matrix.target }}
      - name: Upload packaged executable
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sshmgr-tui-${{ matrix.target }}-${{ steps.artifact.outputs.ref }}-${{ github.sha }}
          path: tui-opentui/dist/packages/sshmgr-tui-*-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sshmgr-tui-*-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          if (( ${#archives[@]} != 3 )); then
            printf 'expected 3 release archives, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(release/*.tar.gz release/*.zip release/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
