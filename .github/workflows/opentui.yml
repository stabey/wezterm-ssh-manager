name: Rust TUI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "tui-rust/**"
      - "plugin/sshmgr/tui.lua"
      - "plugin/sshmgr/config.lua"
      - "plugin/sshmgr/import.lua"
      - "plugin/sshmgr/profiles.lua"
      - "plugin/sshmgr/serialize.lua"
      - "tests/lua_regression.lua"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "REBUILDING.md"
      - ".github/workflows/opentui.yml"
  pull_request:
    paths:
      - "tui-rust/**"
      - "plugin/sshmgr/tui.lua"
      - "plugin/sshmgr/config.lua"
      - "plugin/sshmgr/import.lua"
      - "plugin/sshmgr/profiles.lua"
      - "plugin/sshmgr/serialize.lua"
      - "tests/lua_regression.lua"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "REBUILDING.md"
      - ".github/workflows/opentui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-tui-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tui-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify release tag matches Cargo version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            printf 'tag %s does not match Cargo version %s\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test helper protocol (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          executable="./target/${{ matrix.target }}/release/sshmgr-tui"
          runtime_json="$($executable --create-runtime)"
          runtime_dir="$(printf '%s' "$runtime_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime_dir"])')"
          printf old > "$runtime_dir/snapshot.json"
          printf new > "$runtime_dir/snapshot.json.tmp-smoke"
          "$executable" --replace-file "$runtime_dir/snapshot.json.tmp-smoke" "$runtime_dir/snapshot.json"
          test "$(cat "$runtime_dir/snapshot.json")" = new
          "$executable" --cleanup-runtime "$runtime_dir"
          test ! -e "$runtime_dir"
      - name: Package binary and dependency notices (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 scripts/package.py \
            --binary "target/${{ matrix.target }}/release/sshmgr-tui" \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}"

      - name: Smoke test helper protocol (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = ".\target\${{ matrix.target }}\release\sshmgr-tui.exe"
          $runtime = (& $executable --create-runtime | ConvertFrom-Json)
          Set-Content -NoNewline -Path (Join-Path $runtime.runtime_dir "snapshot.json") -Value "old"
          Set-Content -NoNewline -Path (Join-Path $runtime.runtime_dir "snapshot.json.tmp-smoke") -Value "new"
          & $executable --replace-file (Join-Path $runtime.runtime_dir "snapshot.json.tmp-smoke") (Join-Path $runtime.runtime_dir "snapshot.json")
          if ((Get-Content -Raw (Join-Path $runtime.runtime_dir "snapshot.json")) -ne "new") {
            throw "snapshot replace failed"
          }
          & $executable --cleanup-runtime $runtime.runtime_dir
          if (Test-Path $runtime.runtime_dir) { throw "runtime cleanup failed" }
      - name: Package binary and dependency notices (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package.py `
            --binary ".\target\${{ matrix.target }}\release\sshmgr-tui.exe" `
            --platform "${{ matrix.platform }}" `
            --target "${{ matrix.target }}"

      - name: Upload packaged artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sshmgr-tui-${{ matrix.platform }}-${{ github.sha }}
          path: |
            tui-rust/dist/packages/*.tar.gz
            tui-rust/dist/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sshmgr-tui-*-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "sshmgr-tui-${version}-macos-arm64.tar.gz"
            "sshmgr-tui-${version}-macos-x64.tar.gz"
            "sshmgr-tui-${version}-windows-x64.zip"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || {
              printf 'missing release asset: %s\n' "$asset" >&2
              exit 1
            }
          done
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
