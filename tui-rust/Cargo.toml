[package]
name = "sshmgr-tui"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native terminal UI and SFTP client for wezterm-ssh-manager"
license = "MIT"
repository = "https://github.com/stabey/wezterm-ssh-manager"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
filetime = "0.2.29"
futures-util = "0.3.31"
rand = "0.9.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
russh = { version = "0.63.1", default-features = false, features = ["async-trait", "ring", "rsa"] }
russh-sftp = "2.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[[bin]]
name = "sshmgr-tui"
path = "src/main.rs"
